name: Release

# Push a tag such as v1.2.0 to publish a release. The tag has to match the
# version in pubspec.yaml.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches pubspec.yaml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | cut -d+ -f1)
          if [ "$tag" != "$version" ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match the version $version in pubspec.yaml"
            exit 1
          fi

      - name: Check the signing secrets are set
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::The secret $name is not set"
              missing=1
            fi
          done
          exit $missing

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.x
          cache: true

      - uses: gradle/actions/setup-gradle@v5

      - name: Write the signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          {
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'storeFile=release.keystore\n'
          } > android/key.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Test
        run: flutter test

      # The build number is the run number, so it only goes up.
      - name: Build one APK for each processor type
        run: flutter build apk --release --split-per-abi --build-number=${{ github.run_number }}

      - name: Build one APK for all of them
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Collect the APKs and their checksums
        run: |
          mkdir dist
          out=build/app/outputs/flutter-apk
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "$out/app-$abi-release.apk" "dist/tunes-$GITHUB_REF_NAME-$abi.apk"
          done
          cp "$out/app-release.apk" "dist/tunes-$GITHUB_REF_NAME-universal.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
